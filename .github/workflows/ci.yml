name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            scripts/spike/wails-communication/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            scripts/spike/wails-communication/frontend/package-lock.json

      - name: Download Go modules
        run: go mod download

      - name: Download Spike Go modules
        working-directory: scripts/spike/wails-communication
        run: go mod download

      - name: Install Markdown tooling
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install Spike frontend dependencies
        run: npm --prefix scripts/spike/wails-communication/frontend ci

      - name: Generate Wails bindings
        run: |
          mkdir -p frontend/dist
          printf '<!doctype html><title>binding generation placeholder</title>\n' > frontend/dist/index.html
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.12.0 generate module

      - name: Generate Spike Wails bindings
        working-directory: scripts/spike/wails-communication
        run: |
          mkdir -p frontend/dist
          printf '<!doctype html><title>spike verification placeholder</title>\n' > frontend/dist/index.html
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.12.0 generate module

      - name: Audit Spike frontend
        run: npm --prefix scripts/spike/wails-communication/frontend audit --audit-level=high

      - name: Build Spike frontend
        run: npm --prefix scripts/spike/wails-communication/frontend run build

      - name: Lint Markdown
        run: npm run lint:markdown

      - name: Test frontend
        run: npm --prefix frontend test -- --run

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Test Go
        run: go test ./...

      - name: Test Spike Go
        working-directory: scripts/spike/wails-communication
        run: go test ./...

      - name: Test Go with race detector
        run: go test -race ./...

      - name: Test Spike Go with race detector
        working-directory: scripts/spike/wails-communication
        run: go test -race ./...

      - name: Vet Go
        run: go vet ./...

      - name: Vet Spike Go
        working-directory: scripts/spike/wails-communication
        run: go vet ./...

      - name: Build Spike Go
        working-directory: scripts/spike/wails-communication
        run: go build ./...

  windows:
    name: Windows verification
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            scripts/spike/wails-communication/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            scripts/spike/wails-communication/frontend/package-lock.json

      - name: Download Go modules
        run: go mod download

      - name: Download Spike Go modules
        working-directory: scripts/spike/wails-communication
        run: go mod download

      - name: Install Markdown tooling
        run: npm.cmd ci

      - name: Install frontend dependencies
        run: npm.cmd --prefix frontend ci

      - name: Install Spike frontend dependencies
        run: npm.cmd --prefix scripts/spike/wails-communication/frontend ci

      - name: Generate Wails bindings
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/develop/generate-wails-bindings.ps1

      - name: Generate Spike Wails bindings
        shell: powershell
        working-directory: scripts/spike/wails-communication
        run: |
          New-Item -ItemType Directory -Force frontend/dist | Out-Null
          '<!doctype html><title>spike verification placeholder</title>' |
            Set-Content -Encoding utf8 frontend/dist/index.html
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.12.0 generate module

      - name: Build Spike frontend
        run: npm.cmd --prefix scripts/spike/wails-communication/frontend run build

      - name: Test frontend
        run: npm.cmd --prefix frontend test -- --run

      - name: Build frontend
        run: npm.cmd --prefix frontend run build

      - name: Test Go
        run: go test ./...

      - name: Test Spike Go
        working-directory: scripts/spike/wails-communication
        run: go test ./...

      - name: Vet Go
        run: go vet ./...

      - name: Vet Spike Go
        working-directory: scripts/spike/wails-communication
        run: go vet ./...

      - name: Build Go
        run: go build ./...

      - name: Build Spike Go
        working-directory: scripts/spike/wails-communication
        run: go build ./...
